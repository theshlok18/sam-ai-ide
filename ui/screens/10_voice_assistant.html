<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>S.A.M. - Autonomous Voice Core</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Fonts: Inter & JetBrains Mono -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    @keyframes orb-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(86, 133, 255, 0.45)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 45px rgba(86, 133, 255, 0.75)); }
    }
    @keyframes wave-bounce { 0%, 100% { height: 6px; } 50% { height: 26px; } }
    .animate-core-orb { animation: orb-pulse 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .eq-bar { animation: wave-bounce 1.1s ease-in-out infinite; }
</style>
</head>
<body class="bg-[#090B10] text-[#e2e2e9] antialiased select-none overflow-x-hidden min-h-screen flex flex-col justify-between">
<header class="relative z-30 pt-2 px-4 flex flex-col gap-1 w-full max-w-md mx-auto">
<div class="flex items-center justify-between text-xs text-[#929BAD] px-1">
<div class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[#42D6A4]"></span><span class="tracking-widest">S.A.M. VCORE 4.9</span></div>
<div class="flex items-center gap-1 bg-[#11151D] px-2 py-0.5 rounded border border-[#232B3B]">
<span class="text-[#42D6A4]">LOW LATENCY</span><span>•</span><span class="text-white">18ms</span>
</div>
</div>
<div class="flex items-center justify-between mt-1 h-12">
<button aria-label="Back" class="w-10 h-10 rounded-lg flex items-center justify-center bg-[#11151D] border border-[#232B3B] text-white hover:text-[#5685FF]" onclick="window.location.href='01_home_dashboard.html'">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<button class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#11151D] border border-[#232B3B]">
<span class="material-symbols-outlined text-[16px] text-[#5685FF]">translate</span>
<span class="text-xs text-white font-medium">English / Marathi</span>
</button>
<button class="w-10 h-10 rounded-lg flex items-center justify-center bg-[#11151D] border border-[#232B3B] text-white hover:text-[#5685FF]">
<span class="material-symbols-outlined text-[20px]">graphic_eq</span>
</button>
</div>
</header>
<!-- Center Stage: Visual Orb -->
<main class="relative z-10 flex-1 flex flex-col justify-around max-w-md w-full mx-auto px-4 py-2 overflow-hidden">
<section class="relative flex flex-col items-center justify-center my-auto py-2">
<div class="relative w-64 h-64 flex items-center justify-center">
<div class="absolute inset-0 rounded-full border border-[#5685FF]/20 animate-ping"></div>
<div class="relative w-36 h-36 rounded-full bg-gradient-to-br from-[#5685FF] to-[#9B72FF] p-[2px] animate-core-orb">
<div class="w-full h-full rounded-full bg-[#11151D] flex flex-col items-center justify-center">
<span class="material-symbols-outlined text-[32px] text-[#5685FF]">smart_toy</span>
<span class="text-[9px] tracking-widest text-[#5685FF] font-semibold mt-1">NEURAL CORE</span>
</div>
</div>
</div>
<!-- Real-Time Equalizer -->
<div class="flex items-center gap-1.5 h-8 mt-4 px-4 py-1 rounded-full bg-[#11151D] border border-[#232B3B]">
<span class="w-1 rounded-full bg-[#5685FF] eq-bar" style="animation-delay: 0.1s;"></span>
<span class="w-1 rounded-full bg-[#5685FF] eq-bar" style="animation-delay: 0.35s;"></span>
<span class="w-1 rounded-full bg-[#9B72FF] eq-bar" style="animation-delay: 0.15s;"></span>
<span class="w-1 rounded-full bg-[#42D6A4] eq-bar" style="animation-delay: 0.25s;"></span>
<span class="w-1 rounded-full bg-[#5685FF] eq-bar" style="animation-delay: 0.6s;"></span>
<span class="w-1 rounded-full bg-[#9B72FF] eq-bar" style="animation-delay: 0.4s;"></span>
<span class="w-1 rounded-full bg-[#5685FF] eq-bar" style="animation-delay: 0.1s;"></span>
</div>
</section>
<!-- Transcript -->
<section class="flex flex-col gap-3 my-2 text-xs">
<div class="flex flex-col items-end gap-1">
<span class="text-[10px] text-[#929BAD] pr-1">YOU • 10:42:08</span>
<div class="max-w-[85%] bg-[#171D28] border border-[#232B3B] rounded-xl rounded-tr-none px-3.5 py-2 text-white">
"S.A.M., initialize the LoadMatrix repository."
</div>
</div>
<div class="flex flex-col items-start gap-1">
<span class="text-[10px] text-[#5685FF] pl-1 font-semibold">S.A.M. DISPATCHER • NOW</span>
<div class="max-w-[95%] bg-[#11151D] border-l-2 border-l-[#5685FF] border border-[#232B3B] rounded-xl rounded-tl-none p-3 space-y-2">
<p class="text-white">"Initializing workspace and building the Gradle configuration now, Shlok."</p>
<div class="flex items-center gap-2 bg-[#090B10] px-2 py-1 rounded border border-[#232B3B] text-[11px] font-mono text-[#42D6A4]">
<span class="material-symbols-outlined text-[13px]">terminal</span>
<span>git clone ... &amp;&amp; gradle assembleRelease</span>
</div>
</div>
</div>
</section>
</main>
<!-- Controls -->
<footer class="relative z-30 max-w-md w-full mx-auto px-4 pb-4 pt-1 flex flex-col items-center gap-3">
<div class="flex items-center gap-2 px-3 py-1 rounded-full bg-[#11151D] border border-[#232B3B] text-xs">
<span class="w-2 h-2 rounded-full bg-[#42D6A4] animate-pulse"></span>
<span class="text-white font-medium">Listening...</span>
<span class="text-[#929BAD]">-42 dB</span>
</div>
<div class="flex items-center justify-between w-full px-6">
<button class="w-12 h-12 rounded-full bg-[#11151D] border border-[#232B3B] flex items-center justify-center text-white" onclick="window.location.href='06_ai_chat.html'"><span class="material-symbols-outlined text-[22px]">keyboard</span></button>
<button class="w-16 h-16 rounded-full bg-gradient-to-tr from-[#5685FF] to-[#9B72FF] p-[2px] shadow-lg active:scale-95" onclick="alert('Voice recording active...')">
<div class="w-full h-full rounded-full bg-[#090B10] flex items-center justify-center text-[#5685FF]">
<span class="material-symbols-outlined text-[28px]">mic</span>
</div>
</button>
<button class="w-12 h-12 rounded-full bg-[#11151D] border border-[#232B3B] flex items-center justify-center text-white"><span class="material-symbols-outlined text-[22px]">headphones</span></button>
</div>
</footer>
</body></html>
